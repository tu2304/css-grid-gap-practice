<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Gap - Ví dụ 1</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px; /* Hoặc dùng: gap: 20px; */
        }
        .grid-container div {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            border: 1px solid #999;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>
</body>
</html>
